name: Member's Elite Tournament Signup Screenshot QA
on:
  push:
    paths:
      - 'src/app/tournaments/**'
      - 'src/components/SiteChrome.jsx'
      - 'scripts/qa-tournaments.mjs'
      - '.github/workflows/tournament-signup-qa.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm install --no-save --package-lock=false playwright@1.56.0
      - run: npx playwright install --with-deps chromium
      - name: Test tournament page and capture desktop/mobile screenshots
        run: node scripts/qa-tournaments.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: members-elite-tournament-screenshots
          path: qa-tournament-proof/
          retention-days: 30
